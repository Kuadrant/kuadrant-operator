name: Build and Publish Images For Tag Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-?**"
env:
  IMG_REGISTRY_HOST: quay.io
  IMG_REGISTRY_ORG: kuadrant
  OPERATOR_NAME: kuadrant-operator

permissions:
  contents: read

jobs:
  build:
    name: Build and Push image
    runs-on: ubuntu-latest
    outputs:
      build-tags: ${{ steps.set-outputs.outputs.tags }}
      image: ${{ steps.set-outputs.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set environment variables
        run: |
          bash ./utils/release/load_github_envvar.sh
      - name: Print tags
        run: echo "Git reference name = ${{ github.ref_name }}, kuadrant operator tag = ${{ env.kuadrantOperatorTag }}"
      - name: Verify git reference name matches the kuadrant operator tag
        if: ${{ github.ref_name != env.kuadrantOperatorTag }}
        run: exit 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3
      - name: Login to container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # ratchet:docker/login-action@v2
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}
      - name: Build and Push Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # ratchet:docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: ${{ github.repository_owner == 'kuadrant' }}
          provenance: false
          tags: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}:${{ github.ref_name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            DIRTY=false
            VERSION=${{ github.ref_name }}
            WASM_SHIM_IMAGE=quay.io/kuadrant/wasm-shim:v${{ env.wasmShimVersion }}
      - name: Set outputs
        id: set-outputs
        run: |
          echo "tags=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}:${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Print Image URL
        run: echo "Image pushed to ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}:${{ github.ref_name }}"

  build-bundle:
    name: Build and Push bundle image
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      build-tags: ${{ steps.set-outputs.outputs.tags }}
      image: ${{ steps.set-outputs.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install yq tool
        run: |
          # following sub-shells running make target should have yq already installed
          make yq
      - name: Read operator image reference URL from the manifest bundle
        id: parsed-operator-image
        run: |
          url=`make bundle-operator-image-url`
          echo url=$url >> $GITHUB_OUTPUT
      - name: Print tags and references
        run: echo "Operator image tag = ${{ needs.build.outputs.image }}, Reference in bundle = ${{ steps.parsed-operator-image.outputs.url }}"
      - name: Verify referenced operator image tag matches the tag currently being built
        if: ${{ needs.build.outputs.image != steps.parsed-operator-image.outputs.url }}
        run: exit 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3
      - name: Login to container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # ratchet:docker/login-action@v2
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}
      - name: Build and Push Bundle Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # ratchet:docker/build-push-action@v5
        with:
          context: .
          file: ./bundle.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: ${{ github.repository_owner == 'kuadrant' }}
          provenance: false
          tags: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-bundle:${{ needs.build.outputs.build-tags }}
      - name: Set outputs
        id: set-outputs
        run: |
          echo "tags=${{ needs.build.outputs.build-tags }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-bundle:${{ needs.build.outputs.build-tags }}" >> $GITHUB_OUTPUT
      - name: Print Image URL
        run: echo "Image pushed to ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-bundle:${{ needs.build.outputs.build-tags }}"

  build-catalog:
    name: Build and Push catalog image
    needs: [build, build-bundle]
    runs-on: ubuntu-latest
    outputs:
      build-tags: ${{ steps.set-outputs.outputs.tags }}
      image: ${{ steps.set-outputs.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install yq tool
        run: |
          # following sub-shells running make target should have yq already installed
          make yq
      - name: Set environment variables
        run: |
          bash ./utils/release/load_github_envvar.sh
      - name: Set catalog image variables
        id: catalog-variables
        run: |
          bundleImg=${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-bundle:${{ env.kuadrantOperatorTag }}
          echo bundleImg=$bundleImg >> $GITHUB_OUTPUT
      - name: Print tags and references
        run: |
          echo "Operator bundle image tag = ${{ needs.build-bundle.outputs.image }}"
          echo "Reference in catalog = ${{ steps.catalog-variables.outputs.bundleImg }}"
      - name: Verify referenced bundle tag matches the bundle tag currently being built
        if: ${{ needs.build-bundle.outputs.image != steps.catalog-variables.outputs.bundleImg }}
        run: exit 1
      - name: Generate Catalog Content
        run: |
          # Pinning the channel used in the catalog to "stable".
          # It should not matter for catalogs built for a single release
          make catalog \
            BUNDLE_IMG=${{ steps.catalog-variables.outputs.bundleImg }} \
            CHANNEL=stable
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3
      - name: Login to container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # ratchet:docker/login-action@v2
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}
      - name: Build and Push Catalog Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # ratchet:docker/build-push-action@v5
        with:
          context: ./catalog
          file: ./catalog/${{ env.OPERATOR_NAME }}-catalog.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: ${{ github.repository_owner == 'kuadrant' }}
          provenance: false
          tags: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-catalog:${{ needs.build.outputs.build-tags }}
      - name: Set outputs
        id: set-outputs
        run: |
          echo "tags=${{ needs.build.outputs.build-tags }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-catalog:${{ needs.build.outputs.build-tags }}" >> $GITHUB_OUTPUT
      - name: Print Image URL
        run: echo "Image pushed to ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}/${{ env.OPERATOR_NAME }}-catalog:${{ needs.build.outputs.build-tags }}"

  verify-builds:
    name: Ensure all image references are equal (operator, bundle, catalog)
    needs: [build, build-bundle, build-catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify bundle and operator image tags match
        if: ${{ needs.build.outputs.build-tags != needs.build-bundle.outputs.build-tags }}
        run: exit 1
      - name: Verify catalog and bundle tags match
        if: ${{ needs.build-bundle.outputs.build-tags != needs.build-catalog.outputs.build-tags }}
        run: exit 1
