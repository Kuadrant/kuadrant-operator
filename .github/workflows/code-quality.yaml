name: Code Quality

on:
  workflow_dispatch:
  push:
    branches: ['main', 'release-*']
  pull_request:
    branches: ['*']
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "35 17 * * 6"

permissions:
  contents: read

jobs:
  pre-job:
    runs-on: ubuntu-latest
    name: Pre job checks
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75dd6564bb646f95277dc8c3b80612e46a4a1ea # ratchet:fkirc/skip-duplicate-actions@v3.4.1
        with:
          cancel_others: false
          paths_ignore: '["**.adoc", "**.md", "LICENSE"]'

  verify:
    name: Verify
    needs: pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Run goimports
        run: >
          goimports -w
          $(find .
          -path './vendor' -prune
          -o -path './third_party' -prune
          -o -name '*.pb.go' -prune
          -o -name 'wire_gen.go' -prune
          -o -name '*.deepcopy.go' -prune
          -o -type f -name '*.go' -print)
      - name: Verify goimports
        run: |
          function urlencode() {
            sed ':begin;$!N;s/\n/%0A/;tbegin'
          }
          if [[ $(git diff-index --name-only HEAD --) ]]; then
              for x in $(git diff-index --name-only HEAD --); do
                echo "::error file=$x::Please run goimports.%0A$(git diff $x | urlencode)"
              done
              echo "${{ github.repository }} is out of style. Please run goimports."
              exit 1
          fi
          echo "${{ github.repository }} is formatted correctly."

      - name: Run gofmt
        run: >
          gofmt -s -w
          $(find .
          -path './vendor' -prune
          -o -path './third_party' -prune
          -o -name '*.pb.go' -prune
          -o -name 'wire_gen.go' -prune
          -o -name '*.deepcopy.go' -prune
          -o -type f -name '*.go' -print)
      - name: Verify gofmt
        run: |
          function urlencode() {
            sed ':begin;$!N;s/\n/%0A/;tbegin'
          }
          if [[ $(git diff-index --name-only HEAD --) ]]; then
              for x in $(git diff-index --name-only HEAD --); do
                echo "::error file=$x::Please run gofmt -s.%0A$(git diff $x | urlencode)"
              done
              echo "${{ github.repository }} is out of style. Please run gofmt -s."
              exit 1
          fi
          echo "${{ github.repository }} is formatted correctly."

      - name: Verify fmt
        if: ${{ !cancelled() }}
        run: make verify-fmt
      - name: Verify generate
        if: ${{ !cancelled() }}
        run: make verify-generate
      - name: Verify go.mod
        if: ${{ !cancelled() }}
        run: make verify-go-mod
      - name: Verify manifests
        if: ${{ !cancelled() }}
        run: make verify-manifests
      - name: Validate release data
        if: ${{ !cancelled() }}
        run: make verify-prepare-release
      - name: Test scripts
        if: ${{ !cancelled() }}
        run: make operator-sdk
      - name: Run Promql tests
        if: ${{ !cancelled() }}
        run: make test-alerts

  lint-and-unit-tests:
    name: Lint and Unit Tests
    needs: pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go

      - name: Install lint tools
        env:
          WOKE_VERSION: v0.5.0
        run: |
          TEMP_PATH="$(mktemp -d)"
          cd $TEMP_PATH

          echo '::group::Installing reviewdog'
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b "${TEMP_PATH}" 2>&1
          echo '::endgroup::'

          echo '::group::Installing misspell'
          go install github.com/client9/misspell/cmd/misspell@latest
          echo '::endgroup::'

          echo '::group::Installing woke'
          curl -sfL https://raw.githubusercontent.com/get-woke/woke/main/install.sh | sh -s -- -b "${TEMP_PATH}" "${WOKE_VERSION}" 2>&1
          echo '::endgroup::'

          echo "${TEMP_PATH}" >> $GITHUB_PATH

      - id: golangci_configuration
        uses: andstor/file-existence-action@f02338908d150e00a4b8bebc2dad18bd9e5229b0 # ratchet:andstor/file-existence-action@v1
        with:
          files: .golangci.yaml
      - name: Go Lint
        if: steps.golangci_configuration.outputs.files_exists == 'true'
        run: make run-lint

      - name: misspell
        if: ${{ always() }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}" || exit 1

          echo '::group:: Running github.com/client9/misspell with reviewdog ...'
          set +o pipefail
          git ls-files |
          grep -Ev '^(vendor/|third_party/|.git|utils/|pkg/extension/grpc/)' |
          xargs misspell -error |
          reviewdog -efm="%f:%l:%c: %m" \
                -name="github.com/client9/misspell" \
                -reporter="github-pr-check" \
                -filter-mode="added" \
                -fail-on-error="true" \
                -level="error"

          echo '::endgroup::'

      - name: EOF newline
        if: ${{ always() }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}" || exit 1

          echo '::group:: Flagging missing EOF newlines with reviewdog ...'
          set +o pipefail
          LINT_FILES=$(git ls-files |
          grep -Ev '^(vendor/|third_party/|.git|utils/|pkg/extension/grpc/)' |
          grep -v '\.gitignore$' |
          grep -v '\.png$' |
          grep -v '\.svg$')

          for x in $LINT_FILES; do
            if [[ -f $x && ! ( -s "$x" && -z "$(tail -c 1 $x)" ) ]]; then
              echo $x:$((1 + $(wc -l $x | tr -s ' ' | cut -d' ' -f 1))): Missing newline
            fi
          done |
          reviewdog -efm="%f:%l: %m" \
                -name="EOF Newline" \
                -reporter="github-pr-check" \
                -filter-mode="added" \
                -fail-on-error="true" \
                -level="error"

          echo '::endgroup::'

      - name: Language
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}" || exit 1

          if [ ! -f .wokeignore ]; then
            cat > .wokeignore <<EOF
            vendor/*
            third_party/*
            pkg/extension/grpc/*
          EOF
          fi

          echo '::group:: Running woke with reviewdog ...'
          woke --output simple \
            | reviewdog -efm="%f:%l:%c: %m" \
                -name="woke" \
                -reporter="github-pr-check" \
                -filter-mode="added" \
                -fail-on-error="true" \
                -level="error"
          echo '::endgroup::'

      - name: Run unit tests
        if: ${{ success() || failure() }}
        run: make test-unit
      - name: Upload unit-test coverage reports to CodeCov
        if: ${{ (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # ratchet:codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: false
          verbose: true

  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'schedule' || github.event.schedule == '35 17 * * 6'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # ratchet:github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # ratchet:github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # ratchet:github/codeql-action/analyze@v4

  ratchet:
    name: Check Pinned Actions
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - uses: sethvargo/ratchet@8b4ca256dbed184350608a3023620f267f0a5253 # ratchet:sethvargo/ratchet@v0.11.4
        with:
          files: |
            .github/workflows/*.yaml
            .github/workflows/*.yml

  test-scripts-macos:
    name: Test Scripts (macOS)
    needs: pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go
      - name: Run make operator-sdk
        run: make operator-sdk

  required-checks:
    name: Code Quality Required Checks
    needs: [pre-job, verify, lint-and-unit-tests, codeql, ratchet, test-scripts-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
