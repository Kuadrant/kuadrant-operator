---
name: Kuadrant Upgrade Test

on:
  workflow_dispatch:
    inputs:
      fromVersion:
        description: Kuadrant version to upgrade FROM (e.g. 1.5.3)
        required: true
        default: "1.5.3"
        type: string
      olmFromChannel:
        description: OLM channel for the from version
        required: true
        default: stable
        type: string
      olmUpgradeBundleImg:
        description: Pre-built bundle image to upgrade TO (e.g. quay.io/kuadrant/kuadrant-operator-bundle:v1.6.0)
        required: true
        default: "quay.io/kuadrant/kuadrant-operator-bundle:latest"
        type: string
      helmUpgradeOperatorImg:
        description: Pre-built operator image to upgrade TO (e.g. quay.io/kuadrant/kuadrant-operator:v1.6.0)
        required: true
        default: "quay.io/kuadrant/kuadrant-operator:latest"
        type: string

permissions:
  contents: read

env:
  IMG_REGISTRY_HOST: quay.io
  IMG_REGISTRY_ORG: kuadrant
  KIND_CLUSTER_NAME: kuadrant-test
  FROM_VERSION: ${{ inputs.fromVersion }}

jobs:
  olm-upgrade-test:
    runs-on: ubuntu-latest
    name: OLM Upgrade Test
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        run: make opm yq operator-sdk

      - name: Deploy Kind cluster
        uses: helm/kind-action@94729529f85113b88f4f819c17ce61382e6d8478 # ratchet:helm/kind-action@v1.2.0
        with:
          version: v0.31.0
          config: utils/kind-cluster.yaml
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s

      - name: Install cluster dependencies
        run: |
          make install-metallb
          make install-cert-manager
          make gateway-api-install
          make istio-install
          make deploy-istio-gateway

      - name: Install OLM
        run: make install-olm

      - name: Login to container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # ratchet:docker/login-action@v2
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}

      - name: Print versions
        env:
          FROM_VERSION: ${{ env.FROM_VERSION }}
          UPGRADE_BUNDLE_IMG: ${{ inputs.olmUpgradeBundleImg }}
        run: |
          echo "Installing v${FROM_VERSION}, upgrading to: ${UPGRADE_BUNDLE_IMG}"

      - name: Run OLM upgrade test
        env:
          IMAGE_TAG: upgrade-test-${{ github.run_id }}
          QUAY_IMAGE_EXPIRY: 1d
          UPGRADE_BUNDLE_IMG: ${{ inputs.olmUpgradeBundleImg }}
          FROM_VERSION: ${{ inputs.fromVersion }}
          OLM_FROM_CHANNEL: ${{ inputs.olmFromChannel }}
          IMG_REGISTRY_HOST: ${{ env.IMG_REGISTRY_HOST }}
          IMG_REGISTRY_ORG: ${{ env.IMG_REGISTRY_ORG }}
        run: |
          ./hack/test-olm-upgrade.sh \
            "${IMG_REGISTRY_HOST}/${IMG_REGISTRY_ORG}" \
            "${IMG_REGISTRY_HOST}/${IMG_REGISTRY_ORG}/kuadrant-operator-catalog:v${FROM_VERSION}" \
            "${OLM_FROM_CHANNEL}"

      - name: Pre-integration test cluster setup
        run: |
          # Apply DNS operator dev config
          kubectl patch configmap dns-operator-controller-env -n kuadrant-system --type merge -p '{"data":{"PROVIDER":"aws,azure,google,endpoint,coredns,inmemory"}}'
          # Restart DNS operator controller
          kubectl rollout restart deployment/dns-operator-controller-manager -n kuadrant-system
          kubectl rollout status deployment/dns-operator-controller-manager -n kuadrant-system --timeout=120s
          # Reset operator state by deleting Kuadrant CR
          kubectl delete kuadrant kuadrant -n kuadrant-system --ignore-not-found=true
          sleep 5

      - name: Run integration tests against upgraded cluster
        run: make test-integration GATEWAYAPI_PROVIDER=istio USE_EXISTING_OPERATOR=true INTEGRATION_TEST_PACKAGES="tests/common/... tests/controlplane/... tests/istio/..." INTEGRATION_TESTS_EXTRA_ARGS="--label-filter='!(destructive||observability||in-process-only)'"

      - name: Capture final memory profile (OLM)
        if: always()
        run: |
          set +e
          echo "Capturing final heap profile..."
          kubectl port-forward -n kuadrant-system deployment/kuadrant-operator-controller-manager 6060:6060 &
          PF_PID=$!
          sleep 2
          curl -s http://localhost:6060/debug/pprof/heap > pprof-data/heap-after-upgrade.pb.gz 2>/dev/null || true
          curl -s http://localhost:6060/debug/pprof/goroutine > pprof-data/goroutines-after-upgrade.txt 2>/dev/null || true
          kill $PF_PID 2>/dev/null || true

          # Generate diff and visualizations
          if [ -f pprof-data/heap-baseline.pb.gz ] && [ -f pprof-data/heap-after-upgrade.pb.gz ]; then
            go tool pprof -text -base=pprof-data/heap-baseline.pb.gz pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-diff.txt 2>/dev/null || true
            go tool pprof -text -nodecount=20 pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-final.txt 2>/dev/null || true
            go tool pprof -svg pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-final.svg 2>/dev/null || true
          fi

      - name: Upload pprof artifacts (OLM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pprof-profiles-olm
          path: pprof-data/
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          FROM_VERSION: ${{ env.FROM_VERSION }}
          TO_VERSION: ${{ inputs.olmUpgradeBundleImg }}
          TEST_OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## OLM Upgrade Test: $FROM_VERSION → $TO_VERSION"
            echo ""
            if [ "$TEST_OUTCOME" = "success" ]; then
              echo "✅ **Upgrade test passed**"
            else
              echo "❌ **Upgrade test failed**"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **From version** | \`$FROM_VERSION\` |"
            echo "| **To version** | \`$TO_VERSION\` |"
            echo "| **Test outcome** | $TEST_OUTCOME |"
            echo "| **Gateway provider** | istio |"
            echo ""
            echo "### Components (Post-Upgrade)"
            kubectl get kcp/default -o json | jq -r '(.status.components[] | "- **\(.name)** (v\(.chartVersion))\n  - \([.images[].image] | join("\n  - "))")' 2>/dev/null || echo "Not available"
            echo ""
            if [ -f pprof-data/heap-diff.txt ]; then
              echo "### Memory Growth (Diff)"
              echo "\`\`\`"
              head -15 pprof-data/heap-diff.txt
              echo "\`\`\`"
            fi
            if [ -f pprof-data/goroutines-baseline.txt ] && [ -f pprof-data/goroutines-after-upgrade.txt ]; then
              echo ""
              echo "### Goroutines"
              echo "| | Count |"
              echo "|---|---|"
              BASELINE_GOROUTINES=$(head -1 pprof-data/goroutines-baseline.txt | grep -oE '[0-9]+' | head -1)
              AFTER_GOROUTINES=$(head -1 pprof-data/goroutines-after-upgrade.txt | grep -oE '[0-9]+' | head -1)
              echo "| Baseline | $BASELINE_GOROUTINES |"
              echo "| After Upgrade | $AFTER_GOROUTINES |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  helm-upgrade-test:
    runs-on: ubuntu-latest
    name: Helm Upgrade Test
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tools
        run: make helm yq

      - name: Deploy Kind cluster
        uses: helm/kind-action@94729529f85113b88f4f819c17ce61382e6d8478 # ratchet:helm/kind-action@v1.2.0
        with:
          version: v0.31.0
          config: utils/kind-cluster.yaml
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s

      - name: Install cluster dependencies
        run: |
          make install-metallb
          make install-cert-manager
          make gateway-api-install
          make istio-install
          make deploy-istio-gateway

      - name: Login to container registry
        if: ${{ !inputs.helmUpgradeOperatorImg }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # ratchet:docker/login-action@v2
        with:
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
          registry: ${{ env.IMG_REGISTRY_HOST }}

      - name: Print versions
        env:
          FROM_VERSION: ${{ env.FROM_VERSION }}
          UPGRADE_OPERATOR_IMG: ${{ inputs.helmUpgradeOperatorImg }}
        run: |
          echo "Installing v${FROM_VERSION}, upgrading to: ${UPGRADE_OPERATOR_IMG}"

      - name: Run Helm upgrade test
        env:
          IMAGE_TAG: upgrade-test-${{ github.run_id }}
          QUAY_IMAGE_EXPIRY: 1d
          UPGRADE_OPERATOR_IMG: ${{ inputs.helmUpgradeOperatorImg }}
          FROM_VERSION: ${{ inputs.fromVersion }}
          IMG_REGISTRY_HOST: ${{ env.IMG_REGISTRY_HOST }}
          IMG_REGISTRY_ORG: ${{ env.IMG_REGISTRY_ORG }}
        run: |
          ./hack/test-helm-upgrade.sh \
            "${IMG_REGISTRY_HOST}/${IMG_REGISTRY_ORG}" \
            "${FROM_VERSION}"

      - name: Pre-integration test cluster setup
        run: |
          # Apply DNS operator dev config
          kubectl patch configmap dns-operator-controller-env -n kuadrant-system --type merge -p '{"data":{"PROVIDER":"aws,azure,google,endpoint,coredns,inmemory"}}'
          # Restart DNS operator controller
          kubectl rollout restart deployment/dns-operator-controller-manager -n kuadrant-system
          kubectl rollout status deployment/dns-operator-controller-manager -n kuadrant-system --timeout=120s
          # Reset operator state by deleting Kuadrant CR
          kubectl delete kuadrant kuadrant -n kuadrant-system --ignore-not-found=true
          sleep 5

      - name: Run integration tests against upgraded cluster
        run: make test-integration GATEWAYAPI_PROVIDER=istio USE_EXISTING_OPERATOR=true INTEGRATION_TEST_PACKAGES="tests/common/... tests/controlplane/... tests/istio/..." INTEGRATION_TESTS_EXTRA_ARGS="--label-filter='!(destructive||observability||in-process-only)'"

      - name: Capture final memory profile (Helm)
        if: always()
        run: |
          set +e
          echo "Capturing final heap profile..."
          kubectl port-forward -n kuadrant-system deployment/kuadrant-operator-controller-manager 6060:6060 &
          PF_PID=$!
          sleep 2
          curl -s http://localhost:6060/debug/pprof/heap > pprof-data/heap-after-upgrade.pb.gz 2>/dev/null || true
          curl -s http://localhost:6060/debug/pprof/goroutine > pprof-data/goroutines-after-upgrade.txt 2>/dev/null || true
          kill $PF_PID 2>/dev/null || true

          # Generate diff and visualizations
          if [ -f pprof-data/heap-baseline.pb.gz ] && [ -f pprof-data/heap-after-upgrade.pb.gz ]; then
            go tool pprof -text -base=pprof-data/heap-baseline.pb.gz pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-diff.txt 2>/dev/null || true
            go tool pprof -text -nodecount=20 pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-final.txt 2>/dev/null || true
            go tool pprof -svg pprof-data/heap-after-upgrade.pb.gz > pprof-data/heap-final.svg 2>/dev/null || true
          fi

      - name: Upload pprof artifacts (Helm)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pprof-profiles-helm
          path: pprof-data/
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          FROM_VERSION: ${{ env.FROM_VERSION }}
          TO_VERSION: ${{ inputs.helmUpgradeOperatorImg }}
          TEST_OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Helm Upgrade Test: $FROM_VERSION → $TO_VERSION"
            echo ""
            if [ "$TEST_OUTCOME" = "success" ]; then
              echo "✅ **Upgrade test passed**"
            else
              echo "❌ **Upgrade test failed**"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **From version** | \`$FROM_VERSION\` |"
            echo "| **To version** | \`$TO_VERSION\` |"
            echo "| **Test outcome** | $TEST_OUTCOME |"
            echo "| **Gateway provider** | istio |"
            echo ""
            echo "### Components (Post-Upgrade)"
            kubectl get kcp/default -o json | jq -r '(.status.components[] | "- **\(.name)** (v\(.chartVersion))\n  - \([.images[].image] | join("\n  - "))")' 2>/dev/null || echo "Not available"
            echo ""
            if [ -f pprof-data/heap-diff.txt ]; then
              echo "### Memory Growth (Diff)"
              echo "\`\`\`"
              head -15 pprof-data/heap-diff.txt
              echo "\`\`\`"
            fi
            if [ -f pprof-data/goroutines-baseline.txt ] && [ -f pprof-data/goroutines-after-upgrade.txt ]; then
              echo ""
              echo "### Goroutines"
              echo "| | Count |"
              echo "|---|---|"
              BASELINE_GOROUTINES=$(head -1 pprof-data/goroutines-baseline.txt | grep -oE '[0-9]+' | head -1)
              AFTER_GOROUTINES=$(head -1 pprof-data/goroutines-after-upgrade.txt | grep -oE '[0-9]+' | head -1)
              echo "| Baseline | $BASELINE_GOROUTINES |"
              echo "| After Upgrade | $AFTER_GOROUTINES |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
