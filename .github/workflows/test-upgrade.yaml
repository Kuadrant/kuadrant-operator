---
name: Kuadrant Upgrade Test

on:
  workflow_call:
    inputs:
      kuadrantStartVersion:
        description: Kuadrant start version (X.Y.Z)
        required: false
        type: string
      kuadrantVersion:
        description: Published target release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      kuadrantVersion:
        description: Published target release tag
        required: true
        type: string
      kuadrantStartVersion:
        description: Kuadrant start version (X.Y.Z); defaults to the greatest stable release below the target
        required: false
        type: string
      clusterServer:
        description: Helm test cluster server URL (OLM tests use disposable Kind clusters)
        required: false
        type: string
      clusterToken:
        description: Helm test cluster server bearer token
        required: false
        type: string
      kuadrantNamespace:
        description: Namespace
        required: false
        default: kuadrant-system
        type: string
permissions:
  contents: read

jobs:
  helm-charts-upgrade-test:
    runs-on: ubuntu-latest
    name: Helm Charts Upgrade Test
    if: github.event_name == 'workflow_dispatch' && inputs.kuadrantStartVersion != ''
    env:
      KIND_CLUSTER_NAME: kuadrant-test
      K8S_USER: kuadrant-admin # can be whatever, it does not matter.
      CLUSTER_NAME: remote-cluster
      LOCAL_CLUSTER: ${{ inputs.clusterServer == '' && inputs.clusterToken == '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Install helm
        run: |
          make helm
      - name: Install yq tool
        run: |
          # following sub-shells running make target should have yq already installed
          make yq
      - name: Determine upgrade version
        id: upgrade-version
        run: |
          version=`make helm-print-chart-version`
          echo version=$version >> $GITHUB_OUTPUT
      - name: Print versions
        run: echo "Installing version ${{ inputs.kuadrantStartVersion }}, upgrading to version ${{ steps.upgrade-version.outputs.version }}"
      - name: Deploy local Kind cluster
        if: ${{ env.LOCAL_CLUSTER }}
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # ratchet:helm/kind-action@v1.12.0
        with:
          version: v0.31.0
          config: utils/kind-cluster.yaml
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
      - name: Install kubectl for remote cluster
        if: ${{ !env.LOCAL_CLUSTER }}
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # ratchet:azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Mask cluster token
        if: ${{ !env.LOCAL_CLUSTER }}
        run: |
          CLUSTER_TOKEN=$(jq -r '.inputs.clusterToken' $GITHUB_EVENT_PATH)
          echo ::add-mask::$CLUSTER_TOKEN
          echo CLUSTER_TOKEN=$CLUSTER_TOKEN >> $GITHUB_ENV
      - name: Setup kubectl for remote cluster
        if: ${{ !env.LOCAL_CLUSTER }}
        run: |
          kubectl config set-credentials ${{ env.K8S_USER }}/${{ env.CLUSTER_NAME }} --token ${{ env.CLUSTER_TOKEN }}
          kubectl config set-cluster ${{ env.CLUSTER_NAME }} --insecure-skip-tls-verify=true --server=${{ inputs.clusterServer }}
          kubectl config set-context ${{ inputs.kuadrantNamespace }}/${{ env.CLUSTER_NAME }}/${{ env.K8S_USER }} --user=${{ env.K8S_USER }}/${{ env.CLUSTER_NAME }} --namespace=${{ inputs.kuadrantNamespace }} --cluster=${{ env.CLUSTER_NAME }}
          kubectl config use-context ${{ inputs.kuadrantNamespace }}/${{ env.CLUSTER_NAME }}/${{ env.K8S_USER }}
      ## makes sure cluster is up and running
      - run: |
          kubectl cluster-info
          kubectl get nodes
      - name: Deploy pre-requisites on local Kind cluster
        if: ${{ env.LOCAL_CLUSTER }}
        run: |
          make install-metallb
          make install-cert-manager
          make envoy-gateway-install
          make deploy-eg-gateway
      - name: Install helm and add Kuadrant repo
        run: |
          make helm-add-kuadrant-repo
          bin/helm search repo kuadrant
      - name: Install Kuadrant ${{ inputs.kuadrantStartVersion }}
        run: |
          bin/helm install kuadrant kuadrant/kuadrant-operator \
          --wait \
          --timeout 3m0s \
          --version ${{ inputs.kuadrantStartVersion }} \
          --namespace ${{ inputs.kuadrantNamespace }} \
          --create-namespace
      - name: Deploy Kuadrant
        run: |
          kubectl -n ${{ inputs.kuadrantNamespace }} apply -f - <<EOF
          apiVersion: kuadrant.io/v1beta1
          kind: Kuadrant
          metadata:
            name: kuadrant
          spec: {}
          EOF
      - name: Verify Kuadrant installation
        run: |
          kubectl wait --timeout=300s --for=condition=Ready kuadrant kuadrant -n ${{ inputs.kuadrantNamespace }}
          echo "kuadrant installation ✅"
      - name: Build local chart dependencies for version ${{ steps.upgrade-version.outputs.version }}
        run: |
          make helm-dependency-build
      - name: Start upgrade to kuadrant ${{ steps.upgrade-version.outputs.version }}
        run: |
          bin/helm upgrade kuadrant charts/kuadrant-operator \
          --wait \
          --timeout 3m0s \
          --namespace ${{ inputs.kuadrantNamespace }}
      - name: Determine installed chart
        id: installed-version-after-upgrade
        run: |
          installed_version=`make helm-print-installed-chart-version`
          echo installed_version=$installed_version >> $GITHUB_OUTPUT
      - name: Print versions
        run: echo "Installed version ${{ steps.installed-version-after-upgrade.outputs.installed_version }}, expected version ${{steps.upgrade-version.outputs.version}}"
      - name: Fail when installed version is not the upgraded one
        if: ${{ steps.installed-version-after-upgrade.outputs.installed_version != steps.upgrade-version.outputs.version }}
        run: exit 1
      - name: Verify Kuadrant upgrade
        run: |
          kubectl wait --timeout=300s --for=condition=Ready kuadrant kuadrant -n ${{ inputs.kuadrantNamespace }}
          echo "kuadrant upgrade ✅"
  olm-tests:
    name: OLM ${{ matrix.test }} test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [upgrade, olmv1-install]
    env:
      KIND_CLUSTER_NAME: kuadrant-test
      KUADRANT_NAMESPACE: ${{ inputs.kuadrantNamespace || 'kuadrant-system' }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Resolve release versions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.kuadrantVersion }}
          START_VERSION: ${{ inputs.kuadrantStartVersion }}
        run: |
          make yq
          # Make defaults to 0.0.0/latest; release.yaml is the release source of truth.
          target=${TARGET_VERSION:-$(bin/yq '.kuadrant-operator.version' release.yaml)}
          target=${target#v}
          [[ "$target" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$target" != 0.0.0 ]] || { echo 'Select a published release ref'; exit 1; }
          if [[ -z "$START_VERSION" ]]; then
            # Paginate and compare versions, excluding the target and newer releases.
            # /releases/latest can already point at the release under test.
            gh api --paginate repos/Kuadrant/kuadrant-operator/releases \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > /tmp/kuadrant-releases
            START_VERSION=$(TARGET="$target" python3 - <<'PYTHON'
          import os, re
          target = tuple(map(int, os.environ["TARGET"].split("-")[0].split(".")))
          versions = [tuple(map(int, match.groups())) for line in open("/tmp/kuadrant-releases")
                      if (match := re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", line.strip()))]
          previous = [version for version in versions if version < target]
          if not previous:
              raise SystemExit(f"No stable release precedes {os.environ['TARGET']}")
          print(".".join(map(str, max(previous))))
          PYTHON
            )
          fi
          start=${START_VERSION#v}
          [[ "$start" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          START="$start" TARGET="$target" python3 - <<'PYTHON'
          import os
          start = tuple(map(int, os.environ["START"].split(".")))
          target = tuple(map(int, os.environ["TARGET"].split("-")[0].split(".")))
          if start >= target:
              raise SystemExit(f"Start version {os.environ['START']} must precede target {os.environ['TARGET']}")
          PYTHON
          catalog_img=$(make -s print-catalog-image VERSION="$target")
          {
            echo "KUADRANT_START_VERSION=$start"
            echo "KUADRANT_UPGRADE_VERSION=$target"
            echo "KUADRANT_VERSION=$target"
            echo "KUADRANT_CATALOG_IMG=$catalog_img"
          } >> "$GITHUB_ENV"
      - name: Deploy local Kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # ratchet:helm/kind-action@v1.12.0
        with:
          version: v0.31.0
          config: utils/kind-cluster.yaml
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
      - name: Deploy prerequisites
        run: |
          make install-metallb
          make install-cert-manager
          make envoy-gateway-install
          make deploy-eg-gateway
      - name: Install OLMv0
        if: matrix.test == 'upgrade'
        run: make install-olm
      - name: Test OLMv0 upgrade
        if: matrix.test == 'upgrade'
        run: ./hack/test-olm-upgrade.sh
      - name: Test OLMv1 installation
        if: matrix.test == 'olmv1-install'
        run: ./hack/test-olmv1-install.sh
