apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuadrant-limitador
  namespace: kuadrant-system
spec:
  podSelector:
    matchLabels:
      app: limitador
      limitador-resource: limitador
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC rate limit checks from Envoy
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # OTLP trace export
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
