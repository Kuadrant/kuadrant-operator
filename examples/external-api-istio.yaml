## Prerequisites:
## - Kuadrant and Gateway API installed with Istio as the gateway provider
## - cert-manager with a ClusterIssuer configured (for TLSPolicy)
## - DNS provider credentials secret (for DNSPolicy)
##
## Usage:
##   export EXTERNAL_HOST=my.api.com
##   export INTERNAL_HOST=my.api.local
##   envsubst < examples/external-api-istio.yaml | kubectl apply -n gateway-system -f -
##
## See: doc/user-guides/misc/external-api.md

# Step 1: Register the backend API in Istio
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: backend-api
spec:
  hosts:
    - ${INTERNAL_HOST}
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: https
      protocol: HTTPS
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-api
spec:
  host: ${INTERNAL_HOST}
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: ${INTERNAL_HOST}
---
# Step 2: Deploy the ingress Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress
  labels:
    istio: ingress
spec:
  gatewayClassName: istio
  listeners:
    - name: ingress-tls
      port: 443
      hostname: ${EXTERNAL_HOST}
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: ingress-tls
            kind: Secret
---
# Step 3: Kuadrant policies
apiVersion: kuadrant.io/v1
kind: TLSPolicy
metadata:
  name: ingress-tls
spec:
  targetRef:
    name: ingress
    group: gateway.networking.k8s.io
    kind: Gateway
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: my-cluster-issuer    # replace with your ClusterIssuer name
---
apiVersion: kuadrant.io/v1
kind: DNSPolicy
metadata:
  name: ingress-dns
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: ingress
  providerRefs:
    - name: dns-provider-credentials    # replace with your DNS provider Secret name (must be in the same namespace)
---
# Step 4: HTTPRoute bridging public hostname to backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-host
spec:
  parentRefs:
    - name: ingress
  hostnames:
    - ${EXTERNAL_HOST}
  rules:
    - backendRefs:
        - name: ${INTERNAL_HOST}
          kind: Hostname
          group: networking.istio.io
          port: 443
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: ${INTERNAL_HOST}
